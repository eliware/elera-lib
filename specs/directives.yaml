version: "15.0"
description: Defines requirements for @eliware/elera-lib.
directives:
  - id: E-1320.0
    dos:
      - Export only validateBundle and validateRoutingEvent from the package root.
      - Keep each public function aligned with its end-user documentation.
      - Accept an optional logger with the supported @eliware/log levels.
      - Log validation results with operation context and without input values.
      - Run npm test before each commit.
    donts:
      - Do not expose secrets, tokens, or private data.
      - Do not add client, database, transport, or supervisor behavior to this package.
    examples:
      - |
        import { validateBundle, validateRoutingEvent } from "@eliware/elera-lib";
